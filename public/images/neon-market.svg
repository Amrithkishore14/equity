<svg width="720" height="420" viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Neon market grid with candlesticks and glow line">
  <defs>
    <linearGradient id="glowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7cf0ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff7ad1" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="720" height="420" rx="24" fill="#061021" />
  <g stroke="#12345a" stroke-width="1.1" opacity="0.8">
    <!-- vertical grid -->
    <path d="M40 0 V420 M80 0 V420 M120 0 V420 M160 0 V420 M200 0 V420 M240 0 V420 M280 0 V420 M320 0 V420 M360 0 V420 M400 0 V420 M440 0 V420 M480 0 V420 M520 0 V420 M560 0 V420 M600 0 V420 M640 0 V420 M680 0 V420" />
    <!-- horizontal grid -->
    <path d="M0 40 H720 M0 80 H720 M0 120 H720 M0 160 H720 M0 200 H720 M0 240 H720 M0 280 H720 M0 320 H720 M0 360 H720" />
  </g>
  <g stroke="#0e8fff" stroke-width="2" opacity="0.35">
    <path d="M0 140 H720" />
    <path d="M0 220 H720" />
  </g>
  <!-- Candlesticks -->
  <g filter="url(#softGlow)">
    <rect x="90" y="170" width="20" height="80" rx="5" fill="#6bff7c" />
    <rect x="150" y="140" width="20" height="120" rx="5" fill="#ff7a7a" />
    <rect x="210" y="190" width="20" height="70" rx="5" fill="#6bff7c" />
    <rect x="270" y="130" width="20" height="140" rx="5" fill="#6bff7c" />
    <rect x="330" y="200" width="20" height="60" rx="5" fill="#ff7a7a" />
    <rect x="390" y="150" width="20" height="120" rx="5" fill="#6bff7c" />
    <rect x="450" y="210" width="20" height="70" rx="5" fill="#6bff7c" />
    <rect x="510" y="160" width="20" height="130" rx="5" fill="#ff7a7a" />
    <rect x="570" y="200" width="20" height="70" rx="5" fill="#6bff7c" />
    <rect x="630" y="150" width="20" height="120" rx="5" fill="#6bff7c" />
  </g>
  <!-- Glow line -->
  <path d="M20 320 C120 260 180 250 240 270 C300 290 340 180 420 190 C500 200 540 130 700 170" fill="none" stroke="url(#glowLine)" stroke-width="6" stroke-linecap="round" filter="url(#softGlow)" />
  <path d="M40 280 C140 230 210 240 260 260 C320 285 350 190 430 200 C510 210 560 150 700 190" fill="none" stroke="url(#glowLine)" stroke-width="3" stroke-linecap="round" opacity="0.75" />
</svg>
