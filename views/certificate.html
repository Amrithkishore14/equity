<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Download your educational completion certificate from Equity Investor Club." />
  <meta property="og:title" content="Completion Certificate | Equity Investor Club" />
  <meta property="og:description" content="Generate an educational completion certificate for finished modules." />
  <meta property="og:image" content="/images/logo.jpg" />
  <meta property="og:url" content="https://equityinvestorclub.com/certificate" />
  <link rel="canonical" href="https://equityinvestorclub.com/certificate" />
  <title>Completion Certificate | Equity Investor Club</title>
  <link rel="icon" href="/images/logo.jpg" />
  <link rel="stylesheet" href="/public/css/style.css" />
</head>
<body>
  <div class="content-layer">
  <header>
    <div class="container navbar">
      <a class="brand" href="/"><img src="/images/logo.jpg" alt="Logo" /><span>Equity Investor Club</span></a>
      <button class="nav-toggle" aria-label="Toggle navigation">Menu</button>
      <nav class="nav-links">
        <a href="/">Home</a>
        <a href="/certificate" class="active">Certificate</a>
      </nav>
      <div class="actions"><a class="btn btn-outline" href="/login">Login</a><a class="btn" href="/register">Register</a></div>
    </div>
  </header>
  <main class="container section">
    <h1>Learning Completion Certificate</h1>
    <p class="lead">After completing core modules, download a PDF certificate (educational wording only).</p>
    <div class="form-card">
      <p class="small">You must be logged in to generate your certificate.</p>
      <form id="certForm">
        <label for="module">Module name</label>
        <input id="module" type="text" value="Basics of Stock Market" />
        <button class="btn" type="submit">Download PDF</button>
      </form>
      <div id="certAlert" class="alert" style="display:none;"></div>
    </div>
  </main>
  <footer class="footer"><div class="container footer-grid"><div class="brand"><img src="/images/logo.jpg" alt="Logo" /><span>Equity Investor Club</span></div></div></footer>
  </div>
  <script>
    const certForm = document.querySelector('#certForm');
    const certAlert = document.querySelector('#certAlert');
    certForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const moduleName = document.querySelector('#module').value;
      certAlert.className = 'alert success';
      certAlert.textContent = 'Generating certificate...';
      certAlert.style.display = 'block';
      window.location.href = `/api/certificate?module=${encodeURIComponent(moduleName)}`;
    });
  </script>
  <script src="/public/js/main.js"></script>
</body>
</html>
