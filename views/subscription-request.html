<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Request subscription access at Equity Investor Club." />
  <title>Subscription Request | Equity Investor Club</title>
  <link rel="icon" href="/images/logo.jpg" />
  <link rel="stylesheet" href="/public/css/style.css" />
</head>
<body>
  <div class="content-layer">
  <header>
    <div class="container navbar">
      <a class="brand" href="/"><img src="/images/logo.jpg" alt="Logo" /><span>Equity Investor Club</span></a>
      <button class="nav-toggle" aria-label="Toggle navigation">Menu</button>
      <nav class="nav-links">
        <a href="/">Home</a>
        <a href="/subscriptions" class="active">Subscriptions</a>
      </nav>
    </div>
  </header>

  <main class="container section">
    <div class="badge">Subscription request</div>
    <h1 id="planHeading">Selected plan</h1>
    <p class="lead">Payments are handled via our onboarding team. Access remains educational-only.</p>
    <div class="card" id="planDetails"></div>
    <button class="btn" id="requestAccessBtn" style="margin-top:12px;">Request Access</button>
    <div id="requestAlert" class="alert" style="display:none; margin-top:10px;"></div>
  </main>

  <footer class="footer">
    <div class="container footer-grid">
      <div class="brand"><img src="/images/logo.jpg" alt="Logo" /><span>Equity Investor Club</span></div>
      <p class="small">Educational purpose only. No investment advice.</p>
    </div>
  </footer>
  </div>
  <script src="/public/js/main.js"></script>
  <script src="/public/js/subscription-request.js"></script>
</body>
</html>
