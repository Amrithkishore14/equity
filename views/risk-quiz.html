<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Educational risk profile quiz to understand your learning style: conservative, moderate, or aggressive learner." />
  <meta property="og:title" content="Risk Profile Quiz | Equity Investor Club" />
  <meta property="og:description" content="Take an educational risk profile quiz—no investment advice, only learning guidance." />
  <meta property="og:image" content="/images/logo.jpg" />
  <meta property="og:url" content="https://equityinvestorclub.com/risk-quiz" />
  <link rel="canonical" href="https://equityinvestorclub.com/risk-quiz" />
  <title>Risk Profile Quiz | Equity Investor Club</title>
  <link rel="icon" href="/images/logo.jpg" />
  <link rel="stylesheet" href="/public/css/style.css" />
</head>
<body>
  <div class="content-layer">
  <header>
    <div class="container navbar">
      <a class="brand" href="/"><img src="/images/logo.jpg" alt="Logo" /><span>Equity Investor Club</span></a>
      <button class="nav-toggle" aria-label="Toggle navigation">Menu</button>
      <nav class="nav-links">
        <a href="/">Home</a>
        <a href="/learn">Learn</a>
        <a href="/risk-quiz" class="active">Risk Quiz</a>
      </nav>
      <div class="actions"><a class="btn btn-outline" href="/login">Login</a><a class="btn" href="/register">Register</a></div>
    </div>
  </header>

  <main class="container section">
    <h1>Risk Profile Quiz (Educational)</h1>
    <p class="lead">Learn how risk appetite feels—no investment suggestions.</p>
    <div class="form-card needs-disclaimer">
      <form id="riskForm">
        <label>Time horizon</label>
        <select name="horizon">
          <option value="short">Less than 3 years</option>
          <option value="medium">3-7 years</option>
          <option value="long">7+ years</option>
        </select>
        <label>How do you react to a 10% drop?</label>
        <select name="drop">
          <option value="anxious">Very anxious</option>
          <option value="cautious">Review but stay</option>
          <option value="calm">Add more if thesis holds</option>
        </select>
        <label>Experience level</label>
        <select name="xp">
          <option value="new">New learner</option>
          <option value="some">Some courses/books</option>
          <option value="deep">Deep reading and practice</option>
        </select>
        <button class="btn" type="submit">See category</button>
      </form>
      <div id="riskResult" class="alert" style="display:none; margin-top:10px;"></div>
      <p class="disclaimer" style="margin-top:10px;">Educational only. Not advice.</p>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer-grid">
      <div class="brand"><img src="/images/logo.jpg" alt="Logo" /><span>Equity Investor Club</span></div>
      <p class="small">Build self-awareness before investing.</p>
    </div>
  </footer>
  </div>
  <script>
    const form = document.querySelector('#riskForm');
    const result = document.querySelector('#riskResult');
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const h = form.horizon.value;
      const d = form.drop.value;
      const xp = form.xp.value;
      let score = 0;
      if (h === 'long') score += 2; else if (h === 'medium') score += 1;
      if (d === 'calm') score += 2; else if (d === 'cautious') score += 1;
      if (xp === 'deep') score += 2; else if (xp === 'some') score += 1;
      let category = 'Conservative learner';
      if (score >= 5) category = 'Aggressive learner';
      else if (score >= 3) category = 'Moderate learner';
      result.textContent = `You are a ${category}. Focus on learning pace and risk awareness.`;
      result.className = 'alert success';
      result.style.display = 'block';
    });
  </script>
  <script src="/public/js/main.js"></script>
</body>
</html>
